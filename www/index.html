<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Borç Defteri</title>
<meta name="description" content="Kimden ne aldığını/verdiğini, ürün ve gramaj/adet kuralıyla tutan, çevrimdışı çalışan borç defteri.">
<meta name="theme-color" content="#16110d">
<meta name="color-scheme" content="dark">
<meta name="format-detection" content="telephone=no">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Borç Defteri">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/svg+xml" href="icons/icon.svg">
<link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<style>
:root{
  --bg:#16110d; --bg2:#221b14; --bg3:#2a2118; --line:#3a2f24;
  --gold:#c9a227; --gold-soft:#d9b53c;
  --text:#e9dfce; --dim:#a89a86; --faint:#7d7060;
  --danger:#cf6650; --ok:#7fae6a;
  --paper1:#f6efdd; --paper2:#ece0c6; --ink:#3a2c1c; --ink-dim:#6f5d45;
  --serif:'Iowan Old Style','Palatino Linotype','Palatino','Georgia',serif;
  --sans:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif;
  --mono:'SF Mono','SFMono-Regular','Roboto Mono','Menlo','Consolas',ui-monospace,monospace;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{
  font-family:var(--sans);color:var(--text);
  background:radial-gradient(circle at 50% -10%, #2a221d 0%, var(--bg) 65%) fixed;
  -webkit-tap-highlight-color:transparent;overscroll-behavior:none;
  min-height:100vh;min-height:100dvh;
}
#app{max-width:480px;margin:0 auto;min-height:100vh;min-height:100dvh;display:flex;flex-direction:column;position:relative}
header{display:flex;align-items:center;gap:10px;padding:calc(16px + env(safe-area-inset-top,0px)) 18px 14px;border-bottom:1px solid var(--line)}
header h1{margin:0;font-family:var(--serif);font-size:22px;font-weight:600;letter-spacing:.3px}
.dia{color:var(--gold)}
.hcount{margin-left:auto;font-family:var(--mono);font-size:12px;color:var(--faint)}
#storeWarn{display:none}
#storeWarn.on{display:block;background:#3a2418;border-bottom:1px solid #6b4a2a;color:#e7c9a0;font-size:12.5px;line-height:1.45;padding:10px 16px}
#main{flex:1;padding:18px 16px 32px}
.sec{margin-bottom:16px}
.sec h2{margin:0;font-family:var(--serif);font-size:20px;font-weight:600}
.sec p{margin:4px 0 0;font-size:13px;color:var(--faint)}
.clockline{display:flex;align-items:center;gap:8px;color:var(--faint);font-size:12.5px;margin-bottom:18px}
.clockline svg{color:var(--gold)}

.form{display:grid;gap:14px}
.field label{display:block;font-size:13px;color:var(--dim);margin-bottom:6px;font-weight:600}
input,select,textarea{width:100%;background:var(--bg2);border:1px solid var(--line);color:var(--text);border-radius:12px;padding:12px 14px;font-size:16px;font-family:var(--sans);outline:none}
input.mono,textarea.mono{font-family:var(--mono)}
input::placeholder,textarea::placeholder{color:#8a7c68}
input:focus,select:focus,textarea:focus{border-color:var(--gold);box-shadow:0 0 0 3px rgba(201,162,39,.18)}
.err{color:var(--danger);font-size:12.5px;margin-top:5px}
.note{height:80px;resize:vertical}

.qtywrap{position:relative}
.qtywrap input{padding-right:64px}
.qtyunit{position:absolute;right:14px;top:50%;transform:translateY(-50%);font-size:14px;color:var(--faint);font-weight:600;pointer-events:none}
.rulehint{font-size:12px;color:var(--faint);margin-top:6px}

button{cursor:pointer;font-family:inherit;border:none;transition:transform .06s ease,filter .15s ease}
button:active{transform:translateY(1px)}
button:hover:not(:disabled){filter:brightness(1.06)}
.btn-gold{background:linear-gradient(180deg,var(--gold-soft),var(--gold));color:#1a130b;border-radius:12px;padding:14px 16px;font-weight:700;font-size:16px;box-shadow:0 8px 20px rgba(201,162,39,.25);display:flex;align-items:center;justify-content:center;gap:8px}
.btn-ghost{background:transparent;color:var(--dim);border:1px solid var(--line);border-radius:12px;padding:12px 16px;font-size:15px}
.save{margin-top:6px}

.lsub{font-weight:400;color:var(--faint)}
.routemid{display:flex;align-items:center;gap:10px;margin:8px 0;padding-left:12px;color:var(--gold)}
.routemid .rline{flex:1;height:1px;background:var(--line)}
.swapbtn{background:var(--bg2);border:1px solid var(--line);color:var(--dim);border-radius:999px;padding:7px 12px;font-size:12.5px;font-weight:600;display:flex;align-items:center;gap:6px}
.preview{background:linear-gradient(135deg,var(--paper1) 0%,var(--paper2) 100%);color:var(--ink);border-radius:12px;padding:12px 16px 14px;box-shadow:inset 0 0 40px rgba(120,90,40,.12)}
.psent{font-family:var(--serif);font-size:20px;line-height:1.35;color:#2a2014}
.psent .pq{color:#7a5a12;font-weight:700;white-space:nowrap}
.ph{color:#a4916f;font-style:italic}
.sfx{font-weight:400;opacity:.8}
.stbadge{display:inline-flex;align-items:center;gap:4px;font-size:12px;font-weight:700;padding:3px 10px;border-radius:999px}
.stbadge.acik{background:#f5eccf;color:#8a6a13;border:1px solid #ddc684}
.stbadge.kapandi{background:#e6e0d3;color:#6f5d45;border:1px solid #c7bca6}
.badges{display:flex;flex-wrap:wrap;gap:8px}
.pbadge{margin-bottom:14px}

#nav{position:sticky;bottom:0;background:var(--bg);border-top:1px solid var(--line);box-shadow:0 -8px 24px rgba(0,0,0,.35);display:grid;grid-template-columns:repeat(5,1fr);padding-bottom:env(safe-area-inset-bottom,0px)}
.navitem{background:transparent;padding:10px 0 12px;display:flex;flex-direction:column;align-items:center;gap:4px;color:var(--faint)}
.navitem span{font-size:11px}
.navitem.active{color:var(--gold)}
.navitem.active span{font-weight:700}

.page-wrap{perspective:1200px}
.page{position:relative;border-radius:14px;padding:30px 26px 32px;background:linear-gradient(135deg,var(--paper1) 0%,var(--paper2) 100%);box-shadow:inset 0 0 70px rgba(120,90,40,.13),0 18px 40px rgba(0,0,0,.5);color:var(--ink);min-height:320px;overflow:hidden}
.folio{position:absolute;top:14px;right:16px;font-family:var(--mono);font-size:12px;color:var(--ink-dim);letter-spacing:1px}
.pdate{font-size:12px;letter-spacing:1.4px;text-transform:uppercase;color:var(--ink-dim);margin-bottom:16px}
.pname{font-family:var(--serif);font-size:30px;line-height:1.12;font-weight:600;color:#2a2014}
.prule{display:flex;align-items:center;gap:10px;margin:20px 0 4px}
.prule .rl{height:1px;flex:1;background:linear-gradient(90deg,transparent,#b9962f)}
.prule .rl:last-child{background:linear-gradient(90deg,#b9962f,transparent)}
.prule .pdia{color:var(--gold);font-size:12px}
.prow{margin-top:14px}
.plabel{font-size:12px;letter-spacing:1px;text-transform:uppercase;color:var(--ink-dim);margin-bottom:3px}
.pval{font-size:18px;color:#2a2014}
.pamt{margin-top:20px}
.amtbig{font-family:var(--serif);font-size:34px;font-weight:700;color:#7a5a12}
.psettled{margin-top:16px;font-size:13px;color:#5d7a3a;font-weight:600;display:flex;align-items:center;gap:6px}

.defnav{display:flex;align-items:center;gap:8px;margin-top:18px}
.navbtn{background:var(--bg2);border:1px solid var(--line);color:var(--text);border-radius:11px;padding:12px;display:flex;align-items:center;justify-content:center;gap:4px;font-size:18px}
.navbtn.grow{flex:1;font-size:14px}
.navbtn:disabled{opacity:.45;background:transparent;color:var(--faint);cursor:default}
.slider{width:100%;margin-top:14px;accent-color:var(--gold)}

.searchbox{position:relative;margin-bottom:12px}
.searchbox svg{position:absolute;left:12px;top:50%;transform:translateY(-50%);color:var(--faint)}
.searchbox input{padding-left:38px}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:12px}
.chip{background:transparent;color:var(--dim);border:1px solid var(--line);border-radius:999px;padding:7px 13px;font-size:13px;font-weight:600}
.chip.on{background:var(--gold);color:#1a130b;border-color:var(--gold)}
.sortbtn{background:transparent;color:var(--dim);border:1px solid var(--line);border-radius:10px;padding:8px 12px;font-size:13px;margin-bottom:14px}
.lcard{background:var(--bg2);border:1px solid var(--line);border-radius:12px;padding:14px;margin-bottom:10px}
.lcard.done{opacity:.72}
.ltap{cursor:pointer;-webkit-user-select:none;user-select:none}
.lhead{display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.lname{font-family:var(--serif);font-size:18px}
.lno{color:var(--faint);font-size:12px;margin-right:8px}
.ldate{font-size:11.5px;color:var(--faint);white-space:nowrap}
.lprod{font-size:13px;color:var(--dim);margin-top:4px}
.lnote{font-size:12.5px;color:var(--faint);margin-top:4px;font-style:italic}
.lamt{color:var(--gold);font-weight:700;margin-top:6px;font-size:16px}
.lbottom{display:flex;align-items:center;gap:8px;margin-top:8px;flex-wrap:wrap}
.lbottom .lamt,.lbottom .lprod{margin-top:0}
.lbottom .stbadge{margin-left:auto}
.lacts{display:flex;gap:14px;margin-top:12px;border-top:1px solid var(--line);padding-top:10px;flex-wrap:wrap}
.lact{background:transparent;color:var(--dim);display:flex;align-items:center;gap:6px;font-size:13px}
.lact.settle{color:var(--ok);font-weight:700}
.lconfirm{display:flex;gap:8px;margin-top:12px;align-items:center}
.cwarn{color:var(--danger);font-size:13px;margin-right:auto}
.csil{background:var(--danger);color:#fff;border-radius:9px;padding:7px 14px;font-size:13px;font-weight:600}
.cok{background:var(--ok);color:#11250a;border-radius:9px;padding:7px 14px;font-size:13px;font-weight:700}
.pacts{padding-top:2px}
.pacts .lacts{border-top:none;padding-top:14px}
.cvaz{background:transparent;color:var(--dim);border:1px solid var(--line);border-radius:9px;padding:7px 14px;font-size:13px}
.noresult{color:var(--faint);text-align:center;padding:40px 0}

.card{background:var(--bg2);border:1px solid var(--line);border-radius:14px;padding:16px;margin-bottom:14px}
.ctitle{display:flex;align-items:center;gap:8px;margin-bottom:12px;color:var(--text);font-weight:600;font-size:15px}
.ctitle svg{color:var(--gold)}
.ta{height:140px;font-family:var(--mono);font-size:12.5px;resize:vertical}
.hint{font-size:12.5px;color:var(--faint);margin-bottom:8px}
.row{display:flex;gap:10px;margin-top:10px;flex-wrap:wrap}
.mini{background:var(--bg3);border:1px solid var(--line);color:var(--text);border-radius:10px;padding:9px 14px;font-size:13.5px;display:flex;align-items:center;gap:7px}
.notice{background:var(--bg2);border:1px dashed var(--line);border-radius:12px;padding:14px;color:var(--dim);font-size:13.5px;display:flex;flex-direction:column;gap:10px}
.notice .nbtn{align-self:flex-start;display:inline-flex;width:auto;padding:9px 14px;font-size:13.5px}

.sitem{display:flex;align-items:center;gap:10px;background:var(--bg3);border:1px solid var(--line);border-radius:11px;padding:11px 13px;margin-bottom:9px}
.sitem .sinfo{flex:1;min-width:0}
.sitem .sn{font-size:15px;font-weight:600}
.sitem .sm{font-size:12px;color:var(--faint);margin-top:2px}
.sitem .sdel{background:transparent;color:var(--faint);border:none;padding:6px;display:flex}
.sitem .sdel:hover{color:var(--danger)}
.sempty{color:var(--faint);font-size:13px;padding:6px 2px 12px}
.addgrid{display:grid;gap:10px;margin-top:4px}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:999px;overflow:hidden;background:var(--bg3);width:100%}
.segb{flex:1;background:transparent;color:var(--dim);padding:10px 8px;font-size:13.5px;font-weight:700;border-radius:999px;display:flex;align-items:center;justify-content:center;gap:6px}
.segb.on{background:var(--gold);color:#1a130b}
.seglbl{font-size:13px;color:var(--dim);margin-bottom:6px;font-weight:600}

.empty{text-align:center;padding:54px 20px}
.eicon{margin-bottom:14px;color:var(--gold);display:flex;justify-content:center}
.etitle{font-family:var(--serif);font-size:20px;margin-bottom:6px}
.etext{color:var(--faint);font-size:14px;margin-bottom:20px}
.ebtn{display:inline-flex;width:auto;padding:11px 20px;font-size:14px}

#toastWrap{position:fixed;left:0;right:0;bottom:0;display:flex;justify-content:center;pointer-events:none;z-index:50}
.toast{margin-bottom:84px;background:var(--bg3);color:var(--text);border:1px solid var(--line);border-radius:999px;padding:10px 18px;font-size:13.5px;box-shadow:0 10px 30px rgba(0,0,0,.5);animation:toastIn .2s ease;white-space:nowrap}

.pop-bg{position:fixed;inset:0;z-index:60;background:rgba(10,7,4,.62);-webkit-backdrop-filter:blur(3px);backdrop-filter:blur(3px);display:flex;align-items:center;justify-content:center;padding:24px;animation:fadeIn .15s ease}
.pop{width:100%;max-width:340px;background:var(--bg2);border:1px solid var(--line);border-radius:20px;padding:28px 22px 20px;text-align:center;box-shadow:0 24px 60px rgba(0,0,0,.6);animation:popIn .3s cubic-bezier(.2,.9,.3,1.25)}
.pop-ic{width:88px;height:88px;border-radius:50%;margin:0 auto 16px;display:flex;align-items:center;justify-content:center}
.pop.ok .pop-ic{background:var(--ok);box-shadow:0 0 0 9px rgba(127,174,106,.2)}
.pop.bad .pop-ic{background:var(--danger);box-shadow:0 0 0 9px rgba(207,102,80,.2)}
.pop-ic path{stroke-dasharray:24;stroke-dashoffset:24;animation:draw .3s .15s ease-out forwards}
.pop-t{font-family:var(--serif);font-size:23px;font-weight:600}
.pop-b{margin-top:10px;font-size:14.5px;line-height:1.45;color:var(--dim)}
.pop-b .psent{margin-top:4px;font-size:18px;text-align:left}
.pop-b .preview{margin-top:6px}
.pop-note{margin-top:10px;font-size:13px;color:var(--faint)}
.pop-b ul{margin:0;padding:0;list-style:none;text-align:left}
.pop-b li{padding:7px 0 7px 22px;border-top:1px solid var(--line);position:relative;color:var(--text)}
.pop-b li:first-child{border-top:none}
.pop-b li::before{content:"✕";position:absolute;left:2px;color:var(--danger);font-weight:700}
.pop-btn{width:100%;margin-top:18px;border-radius:12px;padding:13px;font-size:16px;font-weight:700;color:#fff}
.pop.ok .pop-btn{background:#5f8f4c}
.pop.bad .pop-btn{background:var(--danger)}
@keyframes popIn{from{opacity:0;transform:scale(.82)}to{opacity:1;transform:none}}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}
@keyframes draw{to{stroke-dashoffset:0}}
@media (prefers-reduced-motion:reduce){.pop,.pop-bg{animation:none}.pop-ic path{animation:none;stroke-dashoffset:0}}

.flip-right{animation:pageInR .34s cubic-bezier(.2,.7,.2,1)}
.flip-left{animation:pageInL .34s cubic-bezier(.2,.7,.2,1)}
@keyframes pageInR{from{opacity:0;transform:translateX(30px) rotateY(7deg)}to{opacity:1;transform:none}}
@keyframes pageInL{from{opacity:0;transform:translateX(-30px) rotateY(-7deg)}to{opacity:1;transform:none}}
@keyframes toastIn{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:translateY(0)}}
@media (prefers-reduced-motion:reduce){.flip-right,.flip-left,.toast{animation:none}}

textarea::-webkit-scrollbar{width:8px}
textarea::-webkit-scrollbar-thumb{background:#3a2f24;border-radius:8px}

.print-only{display:none}
@media print{
  #app,#toastWrap,#popWrap{display:none!important}
  .print-only{display:block!important;color:#000;background:#fff;padding:24px;font-family:Georgia,serif}
  .print-only h1{font-size:22px;margin:0 0 4px}
  .print-only .psub{color:#555;margin-bottom:12px}
  .print-only .rec{border-bottom:1px solid #ccc;padding:12px 0;page-break-inside:avoid}
  .print-only .rt{font-weight:700;margin-bottom:4px}
  .print-only .rec.gone .rt{color:#9c3b29}
  .print-only .rec b{display:inline-block;width:120px;color:#333}
  .print-only .ver{margin:8px 0 0 16px;font-size:14px;color:#333}
  .print-only .vh{font-weight:700;margin-bottom:2px}
  .print-only .vt{margin-top:6px;color:#7a5a12}
  .print-only .vl{margin-left:16px}
}
</style>
</head>
<body>
<div id="app">
  <header>
    <span class="dia">◆</span>
    <h1>Borç Defteri</h1>
    <span class="hcount" id="hcount"></span>
  </header>
  <div id="storeWarn">⚠ Kalıcı kayıt kapalı: tarayıcı bu sayfa için veri saklamaya izin vermiyor (dosyadan/file:// açma ya da gizli sekme). Kayıtlar yalnızca bu oturumda tutulur; normal sekmede, web adresinden ya da kurulu uygulamadan açın.</div>
  <main id="main"></main>
  <nav id="nav"></nav>
</div>
<div id="toastWrap"></div>
<div id="popWrap"></div>
<div id="printArea" class="print-only"></div>

<script>
"use strict";

/* ---------- sabitler ---------- */
var ENTRIES_KEY  = "borc-defteri:entries";
var PEOPLE_KEY   = "borc-defteri:people";
var PRODUCTS_KEY = "borc-defteri:products";
var ME_ID = "me", ME_NAME = "Ben";   // yalnızca eski Verdim/Aldım kayıtlarındaki defter sahibi; seçicilerde yok
// Düzenlemede sürüm geçmişine (history) kopyalanan alanlar
var VERSION_FIELDS = ["fromId","fromName","toId","toName","productId","productName","unit","decimal","qty","note"];

var ICONS = {
  "plus-circle":'<circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="16"/><line x1="8" y1="12" x2="16" y2="12"/>',
  "book":'<path d="M2 3h6a4 4 0 0 1 4 4v14a3 3 0 0 0-3-3H2z"/><path d="M22 3h-6a4 4 0 0 0-4 4v14a3 3 0 0 1 3-3h7z"/>',
  "list":'<line x1="8" y1="6" x2="21" y2="6"/><line x1="8" y1="12" x2="21" y2="12"/><line x1="8" y1="18" x2="21" y2="18"/><line x1="3" y1="6" x2="3.01" y2="6"/><line x1="3" y1="12" x2="3.01" y2="12"/><line x1="3" y1="18" x2="3.01" y2="18"/>',
  "settings":'<circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 2.83-2.83l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/>',
  "download":'<path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/>',
  "upload":'<path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="17 8 12 3 7 8"/><line x1="12" y1="3" x2="12" y2="15"/>',
  "search":'<circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/>',
  "trash":'<polyline points="3 6 5 6 21 6"/><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/>',

/* ---------- yardımcılar ---------- */
function esc(s){ return String(s).replace(/[&<>"']/g, function(c){ return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]; }); }
function uid(){ return Date.now().toString(36) + Math.random().toString(36).slice(2,8); }
function formatDateLong(iso, withSec){ try { return new Intl.DateTimeFormat("tr-TR",{day:"2-digit",month:"long",year:"numeric",hour:"2-digit",minute:"2-digit",second:withSec ? "2-digit" : undefined}).format(new Date(iso)); } catch(e){ return String(iso); } }
function formatDateShort(iso){ try { return new Intl.DateTimeFormat("tr-TR",{day:"2-digit",month:"2-digit",year:"numeric",hour:"2-digit",minute:"2-digit"}).format(new Date(iso)); } catch(e){ return String(iso); } }

var QTY_DECIMALS = 2;   // küsürlü üründe virgülden sonra en fazla 2 basamak girilebilir
function formatQtyNum(qty, decimal){
  var n = Number(qty)||0;
  // Gösterimde 3 basamağa kadar izin var: eski kayıtlar 3 basamaklı olabilir, yuvarlanarak yanlış gösterilmesin
  return new Intl.NumberFormat("tr-TR",{ minimumFractionDigits:0, maximumFractionDigits: decimal ? 3 : 0 }).format(n);
}
function qtyText(e){ return formatQtyNum(e.qty, e.decimal) + (e.unit ? " " + e.unit : ""); }
function parseQty(s){
  if(s == null || s === "") return NaN;
  var t = String(s).replace(/[^\d,]/g,"").replace(",",".");
  return parseFloat(t);
}
function formatQtyInput(raw, decimal){
  var s = String(raw).replace(/[^\d,]/g,"");
  if(!decimal){
    s = s.split(",")[0].replace(/\D/g,"").replace(/^0+(?=\d)/,"");
    return s;
  }
  var firstComma = s.indexOf(",");
  var intPart, decPart = null;
  if(firstComma !== -1){
    intPart = s.slice(0, firstComma).replace(/,/g,"");
    decPart = s.slice(firstComma+1).replace(/,/g,"").slice(0,QTY_DECIMALS);
  } else { intPart = s; }
  intPart = intPart.replace(/^0+(?=\d)/,"");
  if(intPart === "" && decPart !== null) intPart = "0";
  return decPart !== null ? intPart + "," + decPart : intPart;
}
function ruleText(prod){
  if(!prod) return "Önce ürün seçin";
  return prod.decimal ? "Virgülden sonra en fazla " + QTY_DECIMALS + " basamak (örn. 12,35)" : "Yalnızca tam sayı (örn. 3)";
}

/* Kişi/ürün adları tekil olmalı: boşluklar sadeleştirilir, büyük/küçük harf farkı sayılmaz (Hasan = hasan) */
function cleanName(s){ return String(s == null ? "" : s).replace(/\s+/g," ").trim(); }
function nameKey(s){ return cleanName(s).toLocaleLowerCase("tr"); }
function findByName(list, name){
  var k = nameKey(name);
  for(var i=0;i<list.length;i++) if(nameKey(list[i].name) === k) return list[i];
  return null;
}

function statusBadge(e){
  if(e.status === "kapandi") return '<span class="stbadge kapandi">' + icon("check",12) + ' Kapandı</span>';
  return '<span class="stbadge acik">' + icon("clock",12) + ' Açık</span>';
}

/* Eski kayıtlar yön + tek kişi tutar (Verdim: Ben → kişi, Aldım: kişi → Ben); yüklerken kimden/kime'ye çevrilir. */
function normalizeEntry(e){
  if(!e || e.fromId != null) return e;
  var c = Object.assign({}, e), pid = c.personId || "", pname = c.personName || "";
  if(c.direction === "aldim"){ c.fromId = pid; c.fromName = pname; c.toId = ME_ID; c.toName = ME_NAME; }
  else { c.fromId = ME_ID; c.fromName = ME_NAME; c.toId = pid; c.toName = pname; }
  delete c.direction; delete c.personId; delete c.personName;
  return c;
}
function partyName(id){
  if(id === ME_ID) return ME_NAME;
  var p = getPerson(id); return p ? p.name : "";
}

/* Özel isme ayrılma (-dan/-den/-tan/-ten) ya da yönelme (-a/-e/-ya/-ye) eki: Hasan'dan, Mehmet'ten, Ayşen'e, Ali'ye.
   Son kelimeye bakılır; sesli harfsiz kısaltma harf adıyla okunur (THY'ye), sayı okunuşuyla (Kasa 2'ye). */
var TR_NUM1  = ["","bir","iki","üç","dört","beş","altı","yedi","sekiz","dokuz"];
var TR_NUM10 = ["","on","yirmi","otuz","kırk","elli","altmış","yetmiş","seksen","doksan"];
var TR_INCE_L = ["kemal","cemal","celal","hilal","bilal","nihal","meral","iclal","ikbal","hayal","resul"];   // Kemal'e, Hilal'den
function trNumWord(n){
  n = n.replace(/^0+/, "");
  if(!n) return "sıfır";
  var d = +n.slice(-1), t = +n.slice(-2,-1) || 0;
  if(d) return TR_NUM1[d];
  if(t) return TR_NUM10[t];
  return +n.slice(-3,-2) ? "yüz" : "bin";
}
function trSuffix(name, kind){
  var w = String(name).trim().toLocaleLowerCase("tr").replace(/â/g,"a").replace(/î/g,"i").replace(/û/g,"u")
    .split(/\s+/).pop().replace(/[^0-9a-zçğıöşü]+$/, "");
  var num = w.match(/\d+$/);
  if(num) w = trNumWord(num[0]);
  w = w.replace(/[^a-zçğıöşü]/g, "");
  var vs = w.match(/[aeıioöuü]/g);
  var back = !!vs && "aıou".indexOf(vs[vs.length-1]) !== -1 && TR_INCE_L.indexOf(w) === -1;
  var last = vs ? w.slice(-1) : "e";
  var a = back ? "a" : "e";
  if(kind === "den") return "'" + ("fstkçşhp".indexOf(last) !== -1 ? "t" : "d") + a + "n";
  return "'" + ("aeıioöuü".indexOf(last) !== -1 ? "y" : "") + a;
}
function whoText(id, name, kind){
  if(id === ME_ID) return kind === "den" ? "Benden" : "bana";
  name = name || "?";
  return name + trSuffix(name, kind);
}
function whoHTML(id, name, kind){
  if(id === ME_ID) return "<b>" + whoText(id, name, kind) + "</b>";
  name = name || "?";
  return "<b>" + esc(name) + '</b><span class="sfx">' + esc(trSuffix(name, kind)) + "</span>";
}
function routeText(e){ return whoText(e.fromId, e.fromName, "den") + " " + whoText(e.toId, e.toName, "e"); }
function routeHTML(e){ return whoHTML(e.fromId, e.fromName, "den") + " " + whoHTML(e.toId, e.toName, "e"); }
function sentenceText(e){ return routeText(e) + " " + qtyText(e) + " " + e.productName; }
function sentenceHTML(e){ return routeHTML(e) + ' <span class="pq">' + esc(qtyText(e)) + '</span> ' + esc(e.productName); }

/* ---------- yerel depolama ---------- */
/* localStorage kullanılamazsa (örn. tarayıcıda file:// ile açınca) oturumluk
   belleğe düşeriz; uygulama çalışmaya devam eder, tek seferlik uyarı gösterilir. */
var memStore = {};
var storageWorks = true;
var storageWarned = false;
function probeStorage(){
  try { localStorage.setItem("__probe__","1"); localStorage.removeItem("__probe__"); storageWorks = true; }
  catch(e){ storageWorks = false; }
}
function lsGet(key){
  try { return localStorage.getItem(key); }
  catch(e){ storageWorks = false; return (key in memStore) ? memStore[key] : null; }
}
function lsSet(key, val){
  memStore[key] = val;
  try { localStorage.setItem(key, val); return true; }
  catch(e){ storageWorks = false; return false; }
}
function loadArray(key){
  var raw = lsGet(key);
  if(raw === null) return null;
  try { var a = JSON.parse(raw); return Array.isArray(a) ? a : []; } catch(e){ return []; }
}
function persistWarn(ok){
  if(ok) return;
  showStoreBanner();
  if(storageWarned) return;
  storageWarned = true;
  toast("Kalıcı kayıt kapalı — veriler yalnızca bu oturumda tutulur");
}
function saveEntries(){  persistWarn(lsSet(ENTRIES_KEY,  JSON.stringify(state.entries)));  }
function savePeople(){   persistWarn(lsSet(PEOPLE_KEY,   JSON.stringify(state.people)));   }
function saveProducts(){ persistWarn(lsSet(PRODUCTS_KEY, JSON.stringify(state.products))); }
function showStoreBanner(){
  var el = document.getElementById("storeWarn");
  if(el && !storageWorks) el.classList.add("on");
}

/* Büyük bildirim: yeşil tik (başarılı, kendiliğinden kapanır) ya da kırmızı çarpı (neden(ler)iyle, Tamam'la kapanır).
   Kullanıcı işlemin olup olmadığından emin olsun diye kayıt/ekleme sonuçlarında kullanılır. */
var popClose = null;
function popup(ok, title, bodyHTML){
  if(popClose) popClose();
  var w = document.getElementById("popWrap"), timer;
  var mark = ok ? '<path d="M5 12.5l4.5 4.5L19 7.5"/>' : '<path d="M7 7l10 10"/><path d="M17 7L7 17"/>';
  w.innerHTML = '<div class="pop-bg"><div class="pop ' + (ok ? "ok" : "bad") + '" role="alertdialog" aria-modal="true" aria-labelledby="popTitle">' +
    '<div class="pop-ic"><svg width="46" height="46" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="3" stroke-linecap="round" stroke-linejoin="round">' + mark + '</svg></div>' +
    '<div class="pop-t" id="popTitle">' + esc(title) + '</div>' +
    (bodyHTML ? '<div class="pop-b">' + bodyHTML + '</div>' : "") +
    '<button class="pop-btn" id="popBtn">Tamam</button>' +
  '</div></div>';
  function onKey(ev){ if(ev.key === "Escape" || ev.key === "Enter"){ ev.preventDefault(); popClose(); } }
  popClose = function(){ clearTimeout(timer); w.innerHTML = ""; document.removeEventListener("keydown", onKey, true); popClose = null; };
  w.querySelector(".pop-bg").onclick = function(){ popClose(); };
  document.addEventListener("keydown", onKey, true);
  document.getElementById("popBtn").focus();
  if(ok) timer = setTimeout(popClose, 2600);
  try { if(navigator.vibrate) navigator.vibrate(ok ? 40 : [70,50,70]); } catch(e){}
}

/* Silinen kayıtlar (status "silindi") hiç yok edilmez: Defter/Liste'de görünmez, okunabilir çıktıda "Silindi" olarak kalır.
   Numara (#) tüm kayıtlar içindeki sıradır; böylece Liste ile çıktıdaki "Kayıt N" aynı kalır. */
function liveEntries(){
  var a = [];
  state.entries.forEach(function(e,i){ if(e.status !== "silindi") a.push({ e:e, i:i }); });
  return a;
}
function openCount(){ var n=0; for(var i=0;i<state.entries.length;i++) if(state.entries[i].status === "acik") n++; return n; }

}

  return state.entries.length + " kayıt" + (gone ? " (" + gone + " silindi)" : "");
}
function statusLabel(e){ return e.status === "silindi" ? "Silindi" : e.status === "kapandi" ? "Kapandı" : "Açık"; }

/* Okunabilir çıktının (metin, yazdırma, PDF) ortak içeriği: önce güncel hal, sonra önceki sürümler eskiden yeniye.
   history[k].at o sürümün oluştuğu an: ilk sürümde createdAt, sonrakilerde düzenleme zamanı. */
function recordDoc(e){
  var h = e.history || [];
  var rows = [["Tarih", formatDateLong(e.createdAt)]];
  if(e.updatedAt){
    rows.push(["Sürüm", h.length
      ? (h.length + 1) + " (güncel) · " + formatDateLong(e.updatedAt, true) + " düzenlendi"
      : formatDateLong(e.updatedAt, true) + " düzenlendi (önceki hali kayıtlı değil)"]);
  }
  rows.push(["Kimden", e.fromName], ["Kime", e.toName], ["Ürün", e.productName],
    ["Miktar", qtyText(e), "#7a5a12"],
    ["Durum", statusLabel(e), { silindi:"#9c3b29", kapandi:"#6f5d45" }[e.status] || "#8a6a13"]);
  if(e.settledAt) rows.push(["Kapanış", formatDateLong(e.settledAt)]);
  if(e.deletedAt) rows.push(["Silinme", formatDateLong(e.deletedAt), "#9c3b29"]);
  if(e.note) rows.push(["Not", e.note]);
  var versions = h.map(function(v, k){
    return {
      title: "Sürüm " + (k+1) + " · " + formatDateLong(v.at, true) + (v.at === e.createdAt ? " · oluşturma" : " · düzenleme"),
      lines: [sentenceText(v)].concat(v.note ? ["Not: " + v.note] : [])
    };
  });
  var gap = h.length && h[0].at !== e.createdAt;   // sürüm geçmişi eklenmeden önce düzenlenmiş eski kayıt
  return {
    gone: e.status === "silindi",
    sentence: sentenceText(e),
    rows: rows,
    versions: versions,
    versionsHead: "Önceki sürümler (eskiden yeniye)" + (gap ? " — ilk hali kayıtlı değil" : "")
  };
}
function recordTitle(d, i){ return "Kayıt " + (i+1) + (d.gone ? " (SİLİNDİ)" : "") + " — " + d.sentence; }
function outputHead(){ return "Toplam " + countLabel() + " — " + formatDateShort(new Date().toISOString()); }

function refreshPrintArea(){
  var el = document.getElementById("printArea");
  el.innerHTML = "<h1>Borç Defteri</h1><div class='psub'>" + esc(outputHead()) + "</div>" +
    state.entries.map(function(e,i){
      var d = recordDoc(e);
      return "<div class='rec" + (d.gone ? " gone" : "") + "'><div class='rt'>" + esc(recordTitle(d, i)) + "</div>" +
        d.rows.map(function(r){ return "<div><b>" + esc(r[0]) + "</b>" + esc(r[1]) + "</div>"; }).join("") +
        (d.versions.length
          ? "<div class='ver'><div class='vh'>" + esc(d.versionsHead) + "</div>" +
              d.versions.map(function(v){
                return "<div class='vt'>" + esc(v.title) + "</div>" + v.lines.map(function(l){ return "<div class='vl'>" + esc(l) + "</div>"; }).join("");
              }).join("") + "</div>"
          : "") +
        "</div>";
    }).join("");
}

        '<div class="routemid">' + icon("arr-down",18) + '<span class="rline"></span><button type="button" class="swapbtn" id="swapBtn">' + icon("swap",14) + ' Yer değiştir</button></div>' +
        '<div class="field"><label for="toSel">Kime <span class="lsub">· alan</span></label><select id="toSel">' + partyOptions(f.toId, f.toName) + '</select><div class="err" id="errTo"></div></div>' +
      '</div>' +
      '<div class="field"><label>Ürün</label><select id="productSel">' + productOpts + '</select><div class="err" id="errProduct"></div></div>' +
      '<div class="field"><label>Miktar</label><div class="qtywrap"><input id="qtyInput" class="mono" inputmode="decimal" enterkeyhint="done" autocomplete="off" placeholder="0" value="' + esc(f.qty||"") + '"><span class="qtyunit" id="qtyUnit">' + esc(unitTxt) + '</span></div><div class="rulehint" id="qtyHint">' + esc(ruleText(prod)) + '</div><div class="err" id="errQty"></div></div>' +
      '<div class="field"><label>Not (isteğe bağlı)</label><textarea id="noteInput" class="note" placeholder="Örn. ayar, fiyat, açıklama">' + esc(f.note||"") + '</textarea></div>' +
      '<div class="preview"><div class="plabel">Kayıt</div><div class="psent" id="preview">' + previewHTML() + '</div></div>' +
      '<button class="btn-gold save" id="saveBtn">' + (editing ? icon("pencil",18) + " Güncelle" : icon("plus-circle",18) + " Kaydet") + '</button>' +
      (editing ? '<button class="btn-ghost" id="cancelBtn">Vazgeç</button>' : "") +
    '</div>';
}
function partyOptions(id, name){
  function opt(v, label){ return '<option value="' + esc(v) + '"' + (v === id ? " selected" : "") + ">" + esc(label) + "</option>"; }
  var html = '<option value="">Kişi seçin…</option>';
  var found = !id;
  state.people.forEach(function(p){ if(p.id === id) found = true; html += opt(p.id, p.name); });
  if(!found) html += opt(id, name || "(silinmiş kişi)");
  return html;
}
/* Formu tek cümle olarak gösterir: "Hasan'dan Ayşen'e 1,5 gram 24 Ayar Külçe"; eksik parçalar soru olarak kalır. */
function previewHTML(){
  var f = state.form, prod = getProduct(f.productId);
  function ph(t){ return '<span class="ph">' + t + '</span>'; }
  var q = parseQty(f.qty);
  var unit = prod ? prod.unit : (f.unit || "");
  return (f.fromId ? whoHTML(f.fromId, f.fromName, "den") : ph("Kimden")) + " " +
    (f.toId ? whoHTML(f.toId, f.toName, "e") : ph("kime")) + " " +
    (q > 0 ? '<span class="pq">' + esc(formatQtyNum(q, prod ? prod.decimal : true) + (unit ? " " + unit : "")) + '</span>' : ph("ne kadar")) + " " +
    (f.productId ? esc(f.productName) : ph("ne"));
}
function refreshPreview(){ var el = document.getElementById("preview"); if(el) el.innerHTML = previewHTML(); }
function refreshQtyMeta(){
  var prod = getProduct(state.form.productId);
  var u = document.getElementById("qtyUnit");
  var h = document.getElementById("qtyHint");
  if(u) u.textContent = prod ? prod.unit : "";

}
function wireYeni(){
  wireGoAyarlar(document.getElementById("main"));
  var f = state.form;
  var fs = document.getElementById("fromSel"), ts = document.getElementById("toSel");
  // Ad, seçilen seçeneğin etiketinden alınır: silinmiş kişinin snapshot adı da böylece korunur
  function picked(sel){ return sel.value ? sel.options[sel.selectedIndex].text : ""; }
  if(fs) fs.onchange = function(){ f.fromId = fs.value; f.fromName = picked(fs); setErr("errFrom"); refreshPreview(); };
  if(ts) ts.onchange = function(){ f.toId = ts.value; f.toName = picked(ts); setErr("errTo"); refreshPreview(); };
  var sw = document.getElementById("swapBtn");
  if(sw) sw.onclick = function(){
    var id = f.fromId, name = f.fromName;
    f.fromId = f.toId; f.fromName = f.toName; f.toId = id; f.toName = name;
    fs.innerHTML = partyOptions(f.fromId, f.fromName);
    ts.innerHTML = partyOptions(f.toId, f.toName);
    setErr("errFrom"); setErr("errTo"); refreshPreview();
  };
  var prs = document.getElementById("productSel");
  if(prs) prs.onchange = function(){ f.productId = prs.value; var p = getProduct(prs.value); f.productName = p ? p.name : ""; refreshQtyMeta(); refreshPreview(); };
  var qi = document.getElementById("qtyInput");
  if(qi) qi.oninput = function(){
    var prod = getProduct(f.productId);
    var fmt = formatQtyInput(qi.value, prod ? prod.decimal : true);
    qi.value = fmt; f.qty = fmt;
    refreshPreview();
  };
  var nt = document.getElementById("noteInput"); if(nt) nt.oninput = function(){ f.note = nt.value; };
  var sb = document.getElementById("saveBtn"); if(sb) sb.onclick = addOrUpdate;
  var cb = document.getElementById("cancelBtn"); if(cb) cb.onclick = cancelEdit;
}
function setErr(id, msg){ var el = document.getElementById(id); if(el) el.textContent = msg || ""; }
function findEntry(id){ for(var i=0;i<state.entries.length;i++) if(state.entries[i].id === id) return state.entries[i]; return null; }
function lockReason(e){ return e.status === "kapandi" ? "Kapatılan kayıtlar düzenlenemez." : "Silinen kayıtlar düzenlenemez."; }
function addOrUpdate(){
  var f = state.form;
  var editing = !!f.editingId;
  var failTitle = editing ? "Kayıt güncellenemedi" : "Kayıt oluşturulamadı";
  var productId = f.productId || "";
  var note = (f.note || "").trim();

  var product = getProduct(productId);

  var errs = {};
  if(!f.fromId) errs.from = "Veren kişiyi seçin.";
  if(!f.toId) errs.to = "Alan kişiyi seçin.";
  else if(f.toId === f.fromId) errs.to = "Veren ve alan aynı kişi olamaz.";
  if(!productId) errs.product = "Ürün seçin.";

  var decimal = product ? product.decimal : (f.decimal != null ? f.decimal : true);
  var q = parseQty(f.qty), p = Math.pow(10, QTY_DECIMALS);
  if(!(q > 0)) errs.qty = "Geçerli bir miktar girin.";
  else if(!decimal && Math.abs(q - Math.round(q)) > 1e-9) errs.qty = "Bu ürün için yalnızca tam sayı girilebilir.";
  else if(Math.abs(q*p - Math.round(q*p)) > 1e-6) errs.qty = "Virgülden sonra en fazla " + QTY_DECIMALS + " basamak girilebilir.";

  setErr("errFrom", errs.from); setErr("errTo", errs.to); setErr("errProduct", errs.product); setErr("errQty", errs.qty);
  var reasons = [errs.from, errs.to, errs.product, errs.qty].filter(Boolean);
  if(reasons.length){ popup(false, failTitle, reasonsHTML(reasons)); return; }

  var target = editing ? findEntry(f.editingId) : null;
  if(editing && (!target || target.status !== "acik")){
    state.form = blankForm(); renderTab();
    popup(false, failTitle, reasonsHTML([target ? lockReason(target) : "Kayıt bulunamadı."]));
    return;
  }

  var fields = {
    fromId:f.fromId, fromName:partyName(f.fromId) || f.fromName || "",
    toId:f.toId,     toName:partyName(f.toId) || f.toName || "",
    productId:productId, productName:product ? product.name : (f.productName || ""),
    unit:product ? product.unit : (f.unit || ""), decimal:decimal,
    qty:q, note:note
  };
  var now = new Date().toISOString(), saved;
  if(editing){
    if(target.fromId === fields.fromId && target.toId === fields.toId && target.productId === fields.productId &&
       target.qty === fields.qty && (target.note || "") === fields.note){
      popup(false, failTitle, reasonsHTML(["Hiçbir alan değişmedi."]));
      return;
    }
    // Sınırsız düzenleme: önceki hal olduğu gibi sürüm geçmişine eklenir, hiçbir sürüm kaybolmaz
    var prev = { at: target.updatedAt || target.createdAt };
    VERSION_FIELDS.forEach(function(k){ prev[k] = target[k]; });
    saved = Object.assign({}, target, fields, { history:(target.history || []).concat([prev]), updatedAt:now });
    state.entries = state.entries.map(function(e){ return e.id === saved.id ? saved : e; });
  } else {
    saved = Object.assign({ id:uid() }, fields, { status:"acik", createdAt:now });
    state.entries.push(saved);
  }
  saveEntries(); refreshPrintArea(); updateHeaderCount();
  state.form = blankForm();   // her kayıttan sonra form tamamen sıfırlanır
  renderTab();
  popup(true, editing ? "Kayıt güncellendi" : "Kayıt oluşturuldu",
    '<div class="preview"><div class="psent">' + sentenceHTML(saved) + '</div></div>' +
    (editing ? '<div class="pop-note">Önceki hali sürüm geçmişinde saklandı (Yedek → Okunabilir çıktı).</div>' : ""));
}
function startEdit(id){
  var e = findEntry(id);
  if(!e) return;
  if(e.status !== "acik"){ popup(false, "Düzenlenemez", reasonsHTML([lockReason(e)])); return; }
  state.form = blankForm({
    editingId:id,
    fromId:e.fromId || "", fromName:e.fromName || "",
    toId:e.toId || "",     toName:e.toName || "",
    productId:e.productId || "", productName:e.productName || "", unit:e.unit || "", decimal:e.decimal,
    qty:formatQtyNum(e.qty, e.decimal), note:e.note || ""
  });
  state.tab = "yeni"; renderTab();
}
function cancelEdit(){
  state.form = blankForm();
  renderTab();
}
/* Kalıcı silme yok: kayıt "silindi" olarak işaretlenir, okunabilir çıktıda bütün sürümleriyle kalır */
function doDelete(id){
  var now = new Date().toISOString();
  state.entries = state.entries.map(function(e){
    return e.id === id ? Object.assign({}, e, { status:"silindi", deletedAt:now }) : e;
  });
  state.confirm = null;
  if(state.form.editingId === id) state.form = blankForm();
  saveEntries(); refreshPrintArea(); updateHeaderCount();
  var n = liveEntries().length;
  if(state.pageIdx > n - 1) state.pageIdx = Math.max(0, n - 1);
  toast("Kayıt silindi (çıktıda kalır)");
  if(state.tab === "liste"){ if(!n) renderTab(); else renderListItems(); }
  else if(state.tab === "defter"){ renderTab(); }
}
/* Kapatma nihaidir: kapanan kayıt yeniden açılamaz ve düzenlenemez (bu yüzden onay ister) */
function doSettle(id){
  state.confirm = null;
  if(state.form.editingId === id) state.form = blankForm();
  state.entries = state.entries.map(function(e){
    if(e.id !== id || e.status !== "acik") return e;
    return Object.assign({}, e, { status:"kapandi", settledAt:new Date().toISOString() });
  });
  saveEntries(); refreshPrintArea(); updateHeaderCount();
  toast("Kapatıldı");
  refreshActions();
}
function refreshActions(){ if(state.tab === "liste") renderListItems(); else if(state.tab === "defter") paintPage(); }

/* Liste kartı ve Defter sayfası altındaki düğmeler; Kapat ve Sil geri alınamadığı için önce onay satırı çıkar */
function actionsHTML(e, canDelete){
  var c = state.confirm;
  if(c && c.id === e.id){
    return c.kind === "close"
      ? '<div class="lconfirm"><span class="cwarn">Kapatılsın mı? Kesin karar: bir daha açılamaz, düzenlenemez.</span><button class="cok" data-close-yes="' + e.id + '">Kapat</button><button class="cvaz" data-cancel="1">Vazgeç</button></div>'
      : '<div class="lconfirm"><span class="cwarn">Silinsin mi? Çıktıda “silindi” olarak kalır.</span><button class="csil" data-del="' + e.id + '">Sil</button><button class="cvaz" data-cancel="1">Vazgeç</button></div>';
  }
  var btns = (e.status === "acik"
      ? '<button class="lact settle" data-settle="' + e.id + '">' + icon("check",16) + ' Kapat</button>' +
        '<button class="lact" data-edit="' + e.id + '">' + icon("pencil",15) + ' Düzenle</button>'
      : "") +
    (canDelete ? '<button class="lact" data-trash="' + e.id + '">' + icon("trash",15) + ' Sil</button>' : "");
  return btns ? '<div class="lacts">' + btns + '</div>' : "";
}
function wireActions(host){
  function on(attr, fn){ host.querySelectorAll("[" + attr + "]").forEach(function(el){ el.onclick = function(){ fn(el.getAttribute(attr)); }; }); }
  on("data-edit", startEdit);
  on("data-settle", function(id){ state.confirm = { id:id, kind:"close" }; refreshActions(); });
  on("data-close-yes", doSettle);
  on("data-trash", function(id){ state.confirm = { id:id, kind:"del" }; refreshActions(); });
  on("data-del", doDelete);
  on("data-cancel", function(){ state.confirm = null; refreshActions(); });
}

/* ---------- DEFTER ---------- */
function renderDefter(){

  return '' +
    '<div class="sec"><h2>Defter</h2><p>Kaydırarak, oklarla ya da klavyeyle sayfaları çevirin.</p></div>' +

    '<div class="defnav">' +
      '<button class="navbtn" id="firstBtn">«</button>' +
      '<button class="navbtn grow" id="prevBtn">‹ Önceki</button>' +

      '<button class="navbtn" id="lastBtn">»</button>' +

function paintPage(){
  var wrap = document.getElementById("pageWrap"); if(!wrap) return;
  var o = liveEntries()[state.pageIdx]; if(!o) return;
  var e = o.e;
  var cls = state.dir < 0 ? "flip-left" : "flip-right";

      '<div class="prule"><span class="rl"></span><span class="pdia">◆</span><span class="rl"></span></div>' +
      '<div class="prow"><div class="plabel">Ürün</div><div class="pval">' + esc(e.productName) + '</div></div>' +
      '<div class="pamt"><div class="plabel">Miktar</div><div class="amtbig">' + esc(qtyText(e)) + '</div></div>' +

  var card = document.getElementById("pageCard");
  card.addEventListener("touchstart", onTouchStart, { passive:true });
  card.addEventListener("touchend", onTouchEnd, { passive:true });

function updateDefControls(fromSlider){
  var n = liveEntries().length;
  var f = document.getElementById("firstBtn"), p = document.getElementById("prevBtn"),
      nx = document.getElementById("nextBtn"), l = document.getElementById("lastBtn"), s = document.getElementById("pageSlider");
  if(p) p.disabled = state.pageIdx === 0;
  if(f) f.disabled = state.pageIdx === 0;
  if(nx) nx.disabled = state.pageIdx >= n - 1;
  if(l) l.disabled = state.pageIdx >= n - 1;
  if(s && !fromSlider) s.value = state.pageIdx;
}
function goTo(idx, fromSlider){
  idx = Math.min(Math.max(0, idx), liveEntries().length - 1);
  state.dir = Math.sign(idx - state.pageIdx);
  state.pageIdx = idx;
  paintPage();
  updateDefControls(fromSlider);
}
function wireDefter(){
  var f = document.getElementById("firstBtn"); if(f) f.onclick = function(){ goTo(0); };
  var p = document.getElementById("prevBtn"); if(p) p.onclick = function(){ goTo(state.pageIdx - 1); };
  var nx = document.getElementById("nextBtn"); if(nx) nx.onclick = function(){ goTo(state.pageIdx + 1); };
  var l = document.getElementById("lastBtn"); if(l) l.onclick = function(){ goTo(liveEntries().length - 1); };
  var s = document.getElementById("pageSlider"); if(s) s.oninput = function(){ goTo(Number(s.value), true); };
  paintPage();
  updateDefControls();
}
var touchStart = null;
function onTouchStart(e){ var t = e.changedTouches[0]; touchStart = { x:t.clientX, y:t.clientY }; }
function onTouchEnd(e){
  if(!touchStart) return;
  var t = e.changedTouches[0];
  var dx = t.clientX - touchStart.x, dy = t.clientY - touchStart.y;
  if(Math.abs(dx) > 45 && Math.abs(dx) > Math.abs(dy)) goTo(state.pageIdx + (dx < 0 ? 1 : -1));
  touchStart = null;
}
function openInDefter(entryIdx){
  var pos = 0;
  liveEntries().forEach(function(o, k){ if(o.i === entryIdx) pos = k; });
  state.dir = 0; state.pageIdx = pos; state.tab = "defter"; renderTab();
}

function wireListe(){

function renderListe2(){

function getFiltered(){
  var q = state.search.trim().toLocaleLowerCase("tr");
  var f = liveEntries().filter(function(o){
    var e = o.e;
    if(state.statusFilter === "acik" && e.status === "kapandi") return false;
    if(state.statusFilter === "kapandi" && e.status !== "kapandi") return false;
    if(!q) return true;
    return (e.fromName||"").toLocaleLowerCase("tr").indexOf(q) !== -1
      || (e.toName||"").toLocaleLowerCase("tr").indexOf(q) !== -1
      || (e.productName||"").toLocaleLowerCase("tr").indexOf(q) !== -1
      || (e.note||"").toLocaleLowerCase("tr").indexOf(q) !== -1;
  });
  if(state.newestFirst) f = f.slice().reverse();
  return f;
}

/* ---- PDF üret (görüntü tabanlı; Türkçe karakterler sorunsuz) + paylaş ---- */
function recordsToPdfImages(){
  var W = 1240, H = 1754, margin = 80;          // ~A4 @150dpi
  var images = [], page = null, ctx = null, y = 0;
  function begin(){
    var c = document.createElement("canvas"); c.width = W; c.height = H;
    ctx = c.getContext("2d");
    ctx.fillStyle = "#ffffff"; ctx.fillRect(0,0,W,H);
    ctx.textBaseline = "top";
    page = c; y = margin;
  }
  function flush(){
    if(!page) return;
    var b64 = page.toDataURL("image/jpeg", 0.92).split(",")[1];
    images.push({ jpeg:atob(b64), w:W, h:H });
    page = null;
  }
  function ensure(h){ if(y + h > H - margin){ flush(); begin(); } }
  function hr(color){ ctx.strokeStyle = color; ctx.lineWidth = 2; ctx.beginPath(); ctx.moveTo(margin,y); ctx.lineTo(W-margin,y); ctx.stroke(); }
  function wrapLines(text, font, maxW){
    ctx.font = font;
    var lines = [], cur = "";
    String(text).split(" ").forEach(function(w){
      var t = cur ? cur + " " + w : w;
      if(cur && ctx.measureText(t).width > maxW){ lines.push(cur); cur = w; } else cur = t;
    });
    if(cur) lines.push(cur);
    return lines;
  }
  // Her satır kendi yerini ister: sürümleri çok olan uzun kayıt sayfalara bölünebilir
  function text(str, font, color, x, lh){ ensure(lh); ctx.font = font; ctx.fillStyle = color; ctx.fillText(str, x, y); y += lh; }
  var F_SENT = "bold 30px Georgia, serif", F_VAL = "26px Arial", F_VT = "bold 22px Arial", F_VL = "24px Arial";
  var VAL_X = margin + 230, VAL_W = W - margin - VAL_X, VL_X = margin + 44, VL_W = W - margin - VL_X;

  begin();
  text("Borç Defteri", "bold 54px Georgia, serif", "#2a2014", margin, 70);
  text(outputHead(), "24px Arial", "#6f5d45", margin, 44);
  hr("#caa53a"); y += 34;

  state.entries.forEach(function(e, i){
    var d = recordDoc(e);
    var sent = wrapLines(d.sentence, F_SENT, W - 2*margin);
    var rows = d.rows.map(function(r){ return { label:r[0], lines:wrapLines(r[1], F_VAL, VAL_W), color:r[2] }; });
    var vers = d.versions.map(function(v){
      return { title:v.title, lines:[].concat.apply([], v.lines.map(function(l){ return wrapLines(l, F_VL, VL_W); })) };
    });
    var blockH = 46 + sent.length*42 + 14 + rows.reduce(function(s,r){ return s + r.lines.length*40 + 6; }, 0) +
      (vers.length ? 44 + vers.reduce(function(s,v){ return s + 36 + v.lines.length*34 + 8; }, 0) : 0) + 42;
    ensure(Math.min(blockH, H - 2*margin));   // kısa kayıt bölünmesin

    text("Kayıt " + (i+1) + (d.gone ? "  ·  SİLİNDİ" : ""), "bold 26px Georgia, serif", d.gone ? "#9c3b29" : "#9a7b1f", margin, 46);
    sent.forEach(function(s){ text(s, F_SENT, d.gone ? "#8a7a66" : "#2a2014", margin, 42); });
    y += 14;
    rows.forEach(function(r){
      ensure(46);
      ctx.fillStyle = "#6f5d45"; ctx.font = "22px Arial"; ctx.fillText(r.label, margin, y + 4);
      r.lines.forEach(function(l){ text(l, F_VAL, r.color || "#2a2014", VAL_X, 40); });
      y += 6;
    });
    if(vers.length){
      y += 8;
      text(d.versionsHead, F_VT, "#6f5d45", margin, 36);
      vers.forEach(function(v){
        text(v.title, F_VT, "#9a7b1f", margin + 20, 36);
        v.lines.forEach(function(l){ text(l, F_VL, "#3a2c1c", VL_X, 34); });
        y += 8;
      });
    }
    y += 14; ensure(2); hr("#e2d8c4"); y += 28;
  });
  flush();
  return images;
}
function imagesToPdf(images){
  var PW = 595.28, PH = 841.89;                 // A4 pt
  var parts = [], offset = 0, xref = [];
  function out(s){ parts.push(s); offset += s.length; }
  function startObj(n){ xref[n] = offset; out(n + " 0 obj\n"); }
  var n = images.length, kids = [];
  for(var k=0;k<n;k++) kids.push((3 + k*3) + " 0 R");
  out("%PDF-1.4\n%\xFF\xFF\xFF\xFF\n");
  startObj(1); out("<< /Type /Catalog /Pages 2 0 R >>\nendobj\n");
  startObj(2); out("<< /Type /Pages /Count " + n + " /Kids [" + kids.join(" ") + "] >>\nendobj\n");
  for(var k=0;k<n;k++){
    var img = images[k], pageObj = 3 + k*3, contentObj = 4 + k*3, imageObj = 5 + k*3;
    var scale = Math.min(PW/img.w, PH/img.h);
    var dw = img.w*scale, dh = img.h*scale, tx = (PW-dw)/2, ty = (PH-dh)/2;
    var content = "q\n" + dw.toFixed(2) + " 0 0 " + dh.toFixed(2) + " " + tx.toFixed(2) + " " + ty.toFixed(2) + " cm\n/Im0 Do\nQ\n";
    startObj(pageObj);
    out("<< /Type /Page /Parent 2 0 R /MediaBox [0 0 " + PW + " " + PH + "] /Resources << /XObject << /Im0 " + imageObj + " 0 R >> >> /Contents " + contentObj + " 0 R >>\nendobj\n");
    startObj(contentObj);
    out("<< /Length " + content.length + " >>\nstream\n" + content + "endstream\nendobj\n");
    startObj(imageObj);
    out("<< /Type /XObject /Subtype /Image /Width " + img.w + " /Height " + img.h + " /ColorSpace /DeviceRGB /BitsPerComponent 8 /Filter /DCTDecode /Length " + img.jpeg.length + " >>\nstream\n");
    out(img.jpeg); out("\nendstream\nendobj\n");
  }
  var xrefStart = offset, total = 2 + n*3 + 1;
  out("xref\n0 " + total + "\n0000000000 65535 f \n");
  for(var i=1;i<total;i++){ out(("0000000000" + (xref[i]||0)).slice(-10) + " 00000 n \n"); }
  out("trailer\n<< /Size " + total + " /Root 1 0 R >>\nstartxref\n" + xrefStart + "\n%%EOF");
  return parts.join("");
}
function buildPdfBase64(){
  try { return btoa(imagesToPdf(recordsToPdfImages())); }
  catch(e){ toast("PDF oluşturulamadı"); return null; }
}
function pdfFilename(){ return "borc-defteri-" + new Date().toISOString().slice(0,10) + ".pdf"; }
function base64ToBlob(base64){
  var bin = atob(base64), len = bin.length, bytes = new Uint8Array(len);
  for(var i=0;i<len;i++) bytes[i] = bin.charCodeAt(i);
  return new Blob([bytes], { type:"application/pdf" });
}
function dlBlob(blob, filename){
  var url = URL.createObjectURL(blob);
  var a = document.createElement("a"); a.href = url; a.download = filename;
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(function(){ URL.revokeObjectURL(url); }, 1000);
  toast("PDF indirildi");
}
/* Paylaş: cache'e yazıp sistem paylaş menüsünü açar */
function doSharePdf(){
  if(!state.entries.length){ toast("Paylaşılacak kayıt yok"); return; }
  var base64 = buildPdfBase64(); if(base64 === null) return;
  var filename = pdfFilename();
  var P = window.Capacitor && window.Capacitor.Plugins;
  if(P && P.Filesystem && P.Share){
    toast("PDF hazırlanıyor…");
    P.Filesystem.writeFile({ path:filename, data:base64, directory:"CACHE" })
      .then(function(){ return P.Filesystem.getUri({ path:filename, directory:"CACHE" }); })
      .then(function(res){ return P.Share.share({ title:"Borç Defteri", text:"Borç Defteri — " + state.entries.length + " kayıt", files:[res.uri], dialogTitle:"PDF olarak paylaş" }); })
      .catch(function(err){
        var m = String(err && (err.message || err));
        if(m.indexOf("cancel") !== -1 || m.indexOf("Abort") !== -1) return;   // kullanıcı vazgeçti
        var blob = base64ToBlob(base64);
        if(navigator.canShare){
          var file = new File([blob], filename, { type:"application/pdf" });
          if(navigator.canShare({ files:[file] })){ navigator.share({ files:[file], title:"Borç Defteri" }).catch(function(){ dlBlob(blob, filename); }); return; }
        }
        dlBlob(blob, filename);
      });
  } else {
    var blob = base64ToBlob(base64);
    if(navigator.canShare){
      var file = new File([blob], filename, { type:"application/pdf" });
      if(navigator.canShare({ files:[file] })){ navigator.share({ files:[file], title:"Borç Defteri" }).catch(function(){ dlBlob(blob, filename); }); return; }
    }
    dlBlob(blob, filename);
  }
}
/* İndir: PDF'i cihazın Belgeler klasörüne kaydeder */
function doDownloadPdf(){
  if(!state.entries.length){ toast("İndirilecek kayıt yok"); return; }
  var base64 = buildPdfBase64(); if(base64 === null) return;
  var filename = pdfFilename();
  var P = window.Capacitor && window.Capacitor.Plugins;
  if(P && P.Filesystem){
    var FS = P.Filesystem;
    toast("PDF kaydediliyor…");
    var write = function(){ return FS.writeFile({ path:filename, data:base64, directory:"DOCUMENTS", recursive:true }); };
    var done = function(){ toast("Belgeler klasörüne kaydedildi: " + filename); };
    write().then(done).catch(function(){
      if(FS.requestPermissions){
        FS.requestPermissions().then(write).then(done).catch(function(){ dlBlob(base64ToBlob(base64), filename); });
      } else {
        dlBlob(base64ToBlob(base64), filename);
      }
    });
  } else {
    dlBlob(base64ToBlob(base64), filename);
  }
}
function doImport(){
  var ta = document.getElementById("importTa");
  var txt = ta ? ta.value : "";
  try {
    var data = JSON.parse(txt);
    var inEntries = Array.isArray(data) ? data : (data && Array.isArray(data.entries) ? data.entries : null);
    var inPeople = (data && Array.isArray(data.people)) ? data.people : [];
    var inProducts = (data && Array.isArray(data.products)) ? data.products : [];
    if(inEntries === null) throw new Error("geçersiz yapı");

    // Kişi/ürün adı tekil: yedekteki ad zaten varsa yenisi eklenmez, kayıtlar mevcut olana bağlanır (idMap)
    function importList(list, incoming, make){
      var exist = {}, idMap = {}, added = 0;
      list.forEach(function(x){ exist[x.id] = true; });
      incoming.forEach(function(r){
        if(!r || typeof r !== "object") return;
        var id = r.id || uid(); if(exist[id]) return;
        var item = make(r, id);
        var same = findByName(list, item.name);
        if(same){ idMap[id] = same.id; return; }
        list.push(item); exist[id] = true; added++;
      });
      return { idMap:idMap, added:added };
    }
    var pr = importList(state.products, inProducts, function(r, id){ return { id:id, name:cleanName(r.name) || "Ürün", unit:String(r.unit||"adet"), decimal:!!r.decimal }; });
    var pe = importList(state.people, inPeople, function(r, id){ return { id:id, name:cleanName(r.name) || "Kişi", phone:String(r.phone||"") }; });

    // Kaydın düzenlenebilir alanları (güncel hal ve her sürüm için aynı temizlik)
    function parts(src){
      var fromId = String(pe.idMap[src.fromId] || src.fromId || ""), toId = String(pe.idMap[src.toId] || src.toId || "");
      var productId = String(pr.idMap[src.productId] || src.productId || ""), prod = getProduct(productId);
      return {
        fromId:fromId, fromName:String(src.fromName || partyName(fromId) || ""),
        toId:toId,     toName:String(src.toName || partyName(toId) || ""),
        productId:productId, productName:String(src.productName || (prod ? prod.name : "") || ""),
        unit:String(src.unit || (prod ? prod.unit : "") || ""),
        decimal:(src.decimal != null ? !!src.decimal : (prod ? prod.decimal : true)),
        qty:Number(src.qty)||0, note:String(src.note||"")
      };
    }
    var entExist = {}; state.entries.forEach(function(e){ entExist[e.id] = true; });
    var added = 0;
    for(var k=0;k<inEntries.length;k++){
      var r = inEntries[k];
      if(!r || typeof r !== "object") continue;
      var id = r.id || uid(); if(entExist[id]) continue;
      var entry = Object.assign({ id:id }, parts(normalizeEntry(r)), {   // eski yedeklerdeki yön + kişi → kimden/kime
        status:(r.status === "kapandi" || r.status === "silindi") ? r.status : "acik",
        createdAt:r.createdAt || new Date().toISOString()
      });
      if(r.updatedAt) entry.updatedAt = r.updatedAt;
      if(r.settledAt) entry.settledAt = r.settledAt;
      if(r.deletedAt) entry.deletedAt = r.deletedAt;
      if(Array.isArray(r.history) && r.history.length){
        entry.history = r.history.filter(function(v){ return v && typeof v === "object"; })
          .map(function(v){ return Object.assign({ at:String(v.at || "") }, parts(v)); });
      }
      state.entries.push(entry);
      entExist[id] = true; added++;
    }
    var addedPe = pe.added, addedPr = pr.added;
    state.entries.sort(function(a,b){ return new Date(a.createdAt) - new Date(b.createdAt); });
    state.people.sort(function(a,b){ return a.name.localeCompare(b.name, "tr"); });
    state.products.sort(function(a,b){ return a.name.localeCompare(b.name, "tr"); });
    saveEntries(); savePeople(); saveProducts(); refreshPrintArea(); updateHeaderCount();
    toast(added + " kayıt, " + addedPe + " kişi, " + addedPr + " ürün aktarıldı");
    renderTab();
  } catch(e){ toast("Geçersiz JSON"); }
}

var installPrompt = null;   // Android Chrome'un "yükle" istemi (beforeinstallprompt)
function isNative(){ return !!(window.Capacitor && window.Capacitor.isNativePlatform && window.Capacitor.isNativePlatform()); }
function isStandalone(){
  return (window.matchMedia && window.matchMedia("(display-mode: standalone)").matches) || window.navigator.standalone === true;
}
function isIOS(){ return /iphone|ipad|ipod/i.test(navigator.userAgent) || (navigator.platform === "MacIntel" && navigator.maxTouchPoints > 1); }
function installCardHTML(){
  if(isNative() || isStandalone()) return "";
  var how;
  if(installPrompt) how = '<div class="row"><button class="mini" id="installBtn">' + icon("download",15) + ' Ana ekrana ekle</button></div>';
  else if(isIOS())  how = '<div class="hint">Safari\'de <b>Paylaş</b> → <b>Ana Ekrana Ekle</b>\'ye dokunun.</div>';
  else              how = '<div class="hint">Tarayıcı menüsünden <b>Uygulamayı yükle</b> ya da <b>Ana ekrana ekle</b>\'yi seçin.</div>';
  return '<div class="card" id="installCard"><div class="ctitle">' + icon("smartphone",16) + ' Uygulama olarak kur</div>' +
    '<div class="hint">Ana ekrana eklerseniz tam ekran açılır ve internet olmadan da çalışır.</div>' +
    '<div class="hint">Kayıtlar yalnızca bu tarayıcıda durur; tarayıcı verilerini temizlemek kayıtları da siler. Düzenli JSON yedeği alın.</div>' +
    how + '</div>';
}
function wireInstall(){
  var b = document.getElementById("installBtn");
  if(b) b.onclick = function(){
    var p = installPrompt; if(!p) return;
    installPrompt = null;
    p.prompt();
    p.userChoice.then(refreshInstallCard, refreshInstallCard);
  };
}
function refreshInstallCard(){
  var el = document.getElementById("installCard");
  if(!el) return;             // Yedek sekmesi açık değil
  el.outerHTML = installCardHTML();
  wireInstall();
}
function setupPWA(){
  if(isNative()) return;
  if("serviceWorker" in navigator && /^https?:$/.test(location.protocol)){
    navigator.serviceWorker.register("sw.js").catch(function(){});
  }
  // Tarayıcıdan, yer darlığında bu sitenin verisini silmemesini iste
  if(navigator.storage && navigator.storage.persist){
    navigator.storage.persisted().then(function(p){ if(!p) return navigator.storage.persist(); }).catch(function(){});
  }
  window.addEventListener("beforeinstallprompt", function(e){ e.preventDefault(); installPrompt = e; refreshInstallCard(); });
  window.addEventListener("appinstalled", function(){ installPrompt = null; toast("Uygulama ana ekrana eklendi"); refreshInstallCard(); });
}

/* ---------- başlat ---------- */
function init(){
  probeStorage();
  state.entries = (loadArray(ENTRIES_KEY) || []).map(normalizeEntry);
  state.people   = loadArray(PEOPLE_KEY)   || [];
  state.products = loadArray(PRODUCTS_KEY) || [];   // hazır ürün yok: her kurulum boş başlar

  var NAV = [
    ["yeni","Yeni","plus-circle"],
    ["defter","Defter","book"],
    ["liste","Liste","list"],
    ["ayarlar","Ayarlar","settings"],
    ["yedek","Yedek","download"]
  ];
  var navEl = document.getElementById("nav");
  navEl.innerHTML = NAV.map(function(t){
    return '<button class="navitem ' + (t[0] === state.tab ? "active" : "") + '" data-tab="' + t[0] + '">' + icon(t[2],21) + '<span>' + t[1] + '</span></button>';
  }).join("");
  navEl.querySelectorAll(".navitem").forEach(function(b){
    b.onclick = function(){ state.tab = b.getAttribute("data-tab"); renderTab(); };
  });

  document.addEventListener("keydown", function(e){
    if(state.tab !== "defter" || popClose || !liveEntries().length) return;
    if(e.key === "ArrowRight") goTo(state.pageIdx + 1);
    else if(e.key === "ArrowLeft") goTo(state.pageIdx - 1);
  });

  setInterval(function(){
    var c = document.getElementById("clock");
    if(c){ var d = new Date(); c.textContent = formatDateLong(d.toISOString()) + ":" + String(d.getSeconds()).padStart(2,"0"); }
  }, 1000);

  updateHeaderCount();
  refreshPrintArea();
  renderTab();
  showStoreBanner();
  setupPWA();
}

init();
</script>
